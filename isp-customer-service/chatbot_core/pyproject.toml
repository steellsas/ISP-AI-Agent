[project]
name = "chatbot-core"
version = "0.1.0"
description = "ISP Customer Service Chatbot - Main application with LangGraph"
requires-python = ">=3.12"

dependencies = [
    "isp-shared",
    "langchain>=0.1.0",
    "langgraph>=0.0.20",
    "langsmith>=0.0.87",
    "openai>=1.0.0",
    "streamlit>=1.30.0",
    # RAG dependencies
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
    "rank-bm25>=0.2.2",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "mcp>=1.21.0",
    "colorama>=0.4.6",
    "nest-asyncio>=1.6.0",
    "litellm>=1.80.5",
    # Phase 4 API host
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic-settings>=2.2.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

# Voice slice (Phase 3) — heavy/optional, kept out of the core install so the
# text agent stays light. Install (uv workspace) with:
#   uv sync --package chatbot-core --extra voice
[project.optional-dependencies]
voice = [
    "faster-whisper>=1.0.0",
    "gTTS>=2.5.0",
    "edge-tts>=6.1.0",  # free neural streaming TTS (LT voices), no key/model
    "fastrtc>=0.0.34",  # WebRTC transport: Stream + ReplyOnPause + built-in UI
]

[tool.uv.sources]
isp-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
