<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISP AI Agent — demo</title>
<style>
  :root{
    --bg:#0f1420; --panel:#161d2e; --panel2:#1c2438; --line:#27314a;
    --text:#e6ebf5; --dim:#8b96ad; --accent:#4f8cff; --ok:#3ddc84;
    --warn:#ffb020; --err:#ff5d5d; --engine:#3ddc84; --llm:#b48cff;
    font-size:14px;
  }
  *{box-sizing:border-box; margin:0}
  body{background:var(--bg); color:var(--text);
    font-family:"Segoe UI",system-ui,sans-serif; height:100vh; display:flex; flex-direction:column}
  header{display:flex; align-items:center; gap:12px; padding:10px 16px;
    background:var(--panel); border-bottom:1px solid var(--line)}
  header h1{font-size:15px; font-weight:600; margin-right:8px}
  header .dot{width:10px;height:10px;border-radius:50%;background:var(--dim)}
  header .dot.live{background:var(--ok); box-shadow:0 0 8px var(--ok)}
  input,button{font:inherit; color:inherit}
  input[type=text]{background:var(--panel2); border:1px solid var(--line);
    border-radius:6px; padding:6px 10px; outline:none; min-width:0}
  button{background:var(--accent); border:0; border-radius:6px; padding:7px 14px;
    cursor:pointer; font-weight:600; color:#fff}
  button:disabled{opacity:.4; cursor:default}
  button.danger{background:var(--err)}
  button.ghost{background:var(--panel2); border:1px solid var(--line)}
  #sid{color:var(--dim); font-size:12px; margin-left:auto}
  main{flex:1; display:grid; grid-template-columns: 1fr 420px; min-height:0}
  section{display:flex; flex-direction:column; min-height:0}
  .zone-title{padding:8px 14px; font-size:12px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--dim); border-bottom:1px solid var(--line)}
  /* --- kairė: pokalbis --- */
  #left{border-right:1px solid var(--line)}
  #chat{flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px}
  .msg{max-width:78%; padding:8px 12px; border-radius:12px; line-height:1.45; white-space:pre-wrap}
  .msg.user{align-self:flex-end; background:#24406e}
  .msg.agent{align-self:flex-start; background:var(--panel2)}
  .msg.note{align-self:center; background:none; color:var(--dim); font-size:12px; padding:2px}
  #controls{display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--line);
    background:var(--panel)}
  #text{flex:1}
  #mic.rec{background:var(--err); animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.6}}
  #vu{width:46px; height:34px; background:var(--panel2); border-radius:6px; overflow:hidden;
    display:flex; align-items:flex-end}
  #vu>div{width:100%; background:var(--ok); height:0%}
  /* --- dešinė: smegenys --- */
  #right{background:var(--panel)}
  #brain{flex:1; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:12px}
  .card{background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px 12px}
  .card h3{font-size:11px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--dim); margin-bottom:8px}
  .kv{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:13px}
  .kv b{font-weight:600}
  .badge{display:inline-block; padding:2px 10px; border-radius:99px; font-size:12px;
    font-weight:600; background:#24406e}
  .chip{display:inline-block; padding:1px 8px; border-radius:99px; font-size:11px; font-weight:700}
  .chip.engine{background:rgba(61,220,132,.15); color:var(--engine)}
  .chip.llm{background:rgba(180,140,255,.15); color:var(--llm)}
  #feed{display:flex; flex-direction:column; gap:3px; font-family:Consolas,monospace;
    font-size:12px; max-height:340px; overflow-y:auto}
  #feed div{color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  #feed .t-tool{color:#7fc8ff} #feed .t-rag{color:#ffd479}
  #feed .t-node{color:var(--ok); font-weight:600} #feed .t-llm{color:var(--llm)}
  #feed .t-dec{color:#ff9fb2} #feed .t-scripted{color:var(--engine)}
  footer{padding:8px 16px; border-top:1px solid var(--line); color:var(--dim); font-size:12px;
    background:var(--panel)}
</style>
</head>
<body>
<header>
  <h1>📞 ISP AI Agent</h1>
  <div class="dot" id="statusDot"></div>
  <input type="text" id="phone" value="+37060020105" size="14" title="Skambinančiojo numeris">
  <button id="start">Skambinti</button>
  <button id="stop" class="danger" disabled>Baigti</button>
  <label style="color:var(--dim);font-size:12px;display:flex;align-items:center;gap:4px">
    <input type="checkbox" id="voiceOn" checked> balsas
  </label>
  <span id="sid"></span>
</header>
<main>
  <section id="left">
    <div class="zone-title">🗣️ Pokalbis realiu laiku</div>
    <div id="chat"></div>
    <div id="controls">
      <button id="mic" class="ghost" disabled title="Mikrofonas">🎤</button>
      <div id="vu"><div></div></div>
      <input type="text" id="text" placeholder="…arba rašykite tekstu" disabled>
      <button id="send" disabled>Siųsti</button>
    </div>
  </section>
  <section id="right">
    <div class="zone-title">🧠 Agento vidus (gyvai)</div>
    <div id="brain">
      <div class="card">
        <h3>Aktyvus node</h3>
        <span class="badge" id="node">—</span>
        <span class="chip" id="engineChip" style="display:none"></span>
      </div>
      <div class="card">
        <h3>Paskutinis turn</h3>
        <div class="kv" id="turnKv">—</div>
      </div>
      <div class="card">
        <h3>Skambučio suma</h3>
        <div class="kv" id="totals">—</div>
      </div>
      <div class="card">
        <h3>Įvykiai</h3>
        <div id="feed"></div>
      </div>
    </div>
  </section>
</main>
<footer>📜 Archyvas ir praėjusių skambučių analizė — PR3. Half-duplex (barge-in Phase 5): kalbėkite, kai agentas tyli.</footer>
<script>
"use strict";
const $ = id => document.getElementById(id);
let sid=null, ws=null, playing=false;
let totals={in:0,out:0,cost:0,turns:0};
let audioCtx=null, micStream=null, micNode=null, micSrc=null, recording=false;
let utter=[], speaking=false, silenceMs=0, speechMs=0, sampleRate=16000;

/* ---------- UI helpers ---------- */
function addMsg(cls, text){
  const d=document.createElement("div"); d.className="msg "+cls; d.textContent=text;
  $("chat").appendChild(d); $("chat").scrollTop=$("chat").scrollHeight;
}
function feed(cls, text){
  const d=document.createElement("div"); d.className=cls; d.textContent=text;
  const f=$("feed"); f.appendChild(d);
  while(f.children.length>200) f.removeChild(f.firstChild);
  f.scrollTop=f.scrollHeight;
}
function setLive(on){
  $("statusDot").className="dot"+(on?" live":"");
  for(const id of ["stop","send","text","mic"]) $(id).disabled=!on;
  $("start").disabled=on; $("phone").disabled=on;
}
function fmtUsd(v){ return "$"+v.toFixed(4); }

/* ---------- event rendering (the brain panel) ---------- */
function onEvent(e){
  switch(e.type){
    case "user_turn": addMsg("user", e.text); break;
    case "agent_reply": addMsg("agent", e.text); break;
    case "asr":
      if(e.dropped) addMsg("note", `🎧 atmesta kaip triukšmas: "${e.raw}" (${e.ms} ms)`);
      else if(e.raw!==e.transcript) addMsg("note", `🎧 girdėta: "${e.raw}" → "${e.transcript}"`);
      break;
    case "node": $("node").textContent=e.node; feed("t-node", `▶ NODE ${e.node}`); break;
    case "scripted": feed("t-scripted","⚡ ENGINE scripted atsakymas"); break;
    case "tool_call": feed("t-tool",`⚙️ ${e.name}(${JSON.stringify(e.args||{})})`); break;
    case "tool_result": feed("t-tool",`   ↳ ok=${e.ok} ${e.ms??"?"} ms`); break;
    case "rag": feed("t-rag",`📄 RAG ${e.doc} §${e.section} [${e.step}]`); break;
    case "llm": feed("t-llm",`🧠 ${e.model} in=${e.input_tokens} out=${e.output_tokens} ${e.latency_ms} ms`); break;
    case "decision": feed("t-dec",`❓ ${e.intent||""} ${e.action||""} ${e.from_step??""}${e.to?"→"+e.to:""}`); break;
    case "classify": feed("t-dec",`~ ${e.detector}→${e.label} (${e.routed_by||"?"})`); break;
    case "verdict": feed("t-dec",`◈ VERDICT ${e.group||""} ${e.reason||""}`); break;
    case "voice_latency":
      $("turnKv").insertAdjacentHTML("beforeend",
        `<span>🎤 ASR <b>${e.asr_ms}</b> ms</span><span>🧠 agent <b>${e.agent_ms}</b> ms</span>`+
        `<span>🔊 TTS <b>${e.tts_ms}</b> ms</span><span>Σ <b>${e.total_ms}</b> ms</span>`);
      break;
    case "turn_summary": renderTurn(e); break;
    case "session_end": addMsg("note","— skambutis baigtas —"); break;
  }
}
function renderTurn(s){
  totals.in+=s.input_tokens||0; totals.out+=s.output_tokens||0;
  totals.cost+=s.cost_usd||0; totals.turns+=1;
  const chip=$("engineChip");
  chip.style.display="inline-block";
  chip.className="chip "+(s.engine==="scripted"?"engine":"llm");
  chip.textContent=s.engine==="scripted"?"DETERMINISTINIS VARIKLIS":"LLM";
  $("turnKv").innerHTML=
    `<span>node: <b>${(s.nodes||[]).join("→")||"—"}</b></span>`+
    `<span>⏱️ <b>${s.latency_ms}</b> ms</span>`+
    `<span>tools: <b>${(s.tools||[]).map(t=>t.name).join(", ")||"—"}</b></span>`+
    `<span>tokenai: <b>${s.input_tokens}/${s.output_tokens}</b></span>`+
    `<span>kaina: <b>${fmtUsd(s.cost_usd||0)}</b></span>`;
  $("totals").innerHTML=
    `<span>turn'ai: <b>${totals.turns}</b></span>`+
    `<span>tokenai: <b>${totals.in}/${totals.out}</b></span>`+
    `<span>kaina: <b>${fmtUsd(totals.cost)}</b></span>`;
}

/* ---------- call lifecycle ---------- */
$("start").onclick = async () => {
  const resp = await fetch("/sessions", {method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({caller_phone:$("phone").value||"unknown"})});
  const data = await resp.json();
  sid = data.session_id;
  $("sid").textContent = sid;
  ws = new WebSocket(`ws://${location.host}/ws/call/${sid}`);
  ws.binaryType = "arraybuffer";
  ws.onmessage = m => {
    if(m.data instanceof ArrayBuffer){ playAudio(m.data); return; }
    const e = JSON.parse(m.data);
    if(e.type==="voice_turn"||e.type==="reply"||e.type==="error") return; // rendered via events
    onEvent(e);
  };
  ws.onopen = () => {
    setLive(true);
    addMsg("agent", data.greeting);
    if($("voiceOn").checked){
      fetch(`/sessions/${sid}/greeting/audio`).then(r=>r.ok?r.arrayBuffer():null)
        .then(b=>{ if(b) playAudio(b); }).catch(()=>{});
      startMic();
    }
  };
  ws.onclose = () => setLive(false);
};
$("stop").onclick = async () => {
  stopMic();
  if(sid) await fetch(`/sessions/${sid}`, {method:"DELETE"}).catch(()=>{});
  if(ws) ws.close();
  setLive(false);
};
$("send").onclick = sendText;
$("text").addEventListener("keydown", e=>{ if(e.key==="Enter") sendText(); });
function sendText(){
  const t=$("text").value.trim();
  if(!t||!ws) return;
  ws.send(JSON.stringify({type:"turn", text:t}));
  $("text").value="";
}

/* ---------- audio out (half-duplex: mic pauses while playing) ---------- */
function playAudio(buf){
  const blob=new Blob([buf],{type:"audio/mpeg"});
  const a=new Audio(URL.createObjectURL(blob));
  playing=true;
  a.onended=()=>{ playing=false; };
  a.onerror=()=>{ playing=false; };
  a.play().catch(()=>{ playing=false; });
}

/* ---------- mic in: energy end-pointing -> one WAV utterance ---------- */
async function startMic(){
  if(recording) return;
  try{
    micStream = await navigator.mediaDevices.getUserMedia({audio:{
      echoCancellation:true, noiseSuppression:true, channelCount:1}});
  }catch(err){ addMsg("note","🎤 mikrofonas nepasiekiamas: "+err.message); return; }
  audioCtx = new AudioContext({sampleRate:16000});
  sampleRate = audioCtx.sampleRate; // browser may ignore the hint — header carries the truth
  micSrc = audioCtx.createMediaStreamSource(micStream);
  micNode = audioCtx.createScriptProcessor(4096,1,1);
  micSrc.connect(micNode); micNode.connect(audioCtx.destination);
  recording=true; $("mic").classList.add("rec");
  const frameMs = 4096/sampleRate*1000;
  micNode.onaudioprocess = ev => {
    if(!recording) return;
    const ch = ev.inputBuffer.getChannelData(0);
    let sum=0; for(let i=0;i<ch.length;i++) sum+=ch[i]*ch[i];
    const rms=Math.sqrt(sum/ch.length);
    $("vu").firstElementChild.style.height=Math.min(100,rms*800)+"%";
    if(playing){ speaking=false; utter=[]; return; }  // half-duplex
    if(rms>0.012){
      speaking=true; speechMs+=frameMs; silenceMs=0;
      utter.push(new Float32Array(ch));
    }else if(speaking){
      silenceMs+=frameMs;
      utter.push(new Float32Array(ch));
      if(silenceMs>900){
        if(speechMs>350) sendUtterance();
        speaking=false; speechMs=0; silenceMs=0; utter=[];
      }
    }
  };
}
function stopMic(){
  recording=false; $("mic").classList.remove("rec");
  if(micNode) micNode.disconnect();
  if(micSrc) micSrc.disconnect();
  if(micStream) micStream.getTracks().forEach(t=>t.stop());
  if(audioCtx) audioCtx.close();
  micNode=micSrc=micStream=audioCtx=null;
}
$("mic").onclick = () => { recording?stopMic():startMic(); };
function sendUtterance(){
  const total=utter.reduce((n,a)=>n+a.length,0);
  const pcm=new Int16Array(total);
  let o=0;
  for(const a of utter){
    for(let i=0;i<a.length;i++){
      const s=Math.max(-1,Math.min(1,a[i]));
      pcm[o++]=s<0?s*0x8000:s*0x7fff;
    }
  }
  ws.send(wavEncode(pcm, sampleRate));
  addMsg("note","🎤 siunčiama…");
}
function wavEncode(pcm, rate){
  const buf=new ArrayBuffer(44+pcm.length*2);
  const v=new DataView(buf);
  const wr=(off,s)=>{for(let i=0;i<s.length;i++)v.setUint8(off+i,s.charCodeAt(i));};
  wr(0,"RIFF"); v.setUint32(4,36+pcm.length*2,true); wr(8,"WAVE");
  wr(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true);
  v.setUint16(34,16,true); wr(36,"data"); v.setUint32(40,pcm.length*2,true);
  new Int16Array(buf,44).set(pcm);
  return buf;
}
</script>
</body>
</html>
