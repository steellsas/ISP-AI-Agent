debt_dispute: ["nesutink", "neteising", "klaid", "sumokėjau", "sumokejau", "apmokėjau", "apmokejau", "mokėjau", "mokejau", "nesuprantu", "neaišku", "neaisku", "kodėl tiek", "kodel tiek", "kodėl tokia", "kodel tokia", "per didel", "ne mano skola", "neturiu skol", "iš kur skola", "is kur skola", "kaip tai skola"]

# --- agent/intents.py ------------------------------------------------------------------------

# The internet named in the caller's words (for "internetas, televizija, niekas neveikia" —
# the service the others depend on is the problem to solve first).
service_mentions_internet: ["internet", "wifi", "wi-fi"]

# --- agent/decide/rules/head.py ------------------------------------------------------------

# The caller will not say their name (it is recorded as "nenurodyta", never re-asked).
caller_name_refused: ["nesvarbu", "nesakysiu", "nenoriu sakyt", "nenoriu pasakyt", "nebūtina", "nebutina", "koks skirtumas", "kam jums vardas"]

# Patvirtinimas, kad klientas darys / daro tai, ko paprašėme („gerai", „ok", „bandau") —
# NE atsakymas ir ne „padariau". Variklis tada pasako, kad palauks, ir instrukcijos
# NEKARTOJA (S4 eval'e agentas tris ėjimus kartojo tą patį).
acknowledge:
  - gerai
  - gerai gerai
  - ok
  - okey
  - bandau
  - darau
  - tuoj
  - sekundę
  - minutėlę
  - žiūriu
  - einu
  - eisiu
  - pažiūrėsiu
  - patikrinsiu
