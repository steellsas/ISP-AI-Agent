account_code_words: ["kod"]
# Clarifying phase: the last question asked for a surname.
surname_words: ["pavard"]
# A question echoing a concrete address: a digit plus one of these.
street_mark_words: ["gatv", " g."]
# The last question asked for the street / address name.
street_asked_words: ["gatv", "adres", "pavadinim"]
# "Koks mano adresas?" / "Dėl kokio adreso kalbam?"
address_topic_words: ["adres"]
which_words: ["kok", "kur"]
# "Aš Jums perskambinsiu" — the caller will call back.
will_call_back: ["perskambin", "paskambinsiu", "pats paskambin"]
later_words: ["vėliau", "veliau"]
# After "ar negalite dabar patikrinti?": a clear back-to-solving signal ...
resume_solving: ["galiu", "radau", "viskas gerai", "veikia", "nereikia", "jau "]
# ... unless negated.
resume_solving_denied: ["negaliu", "nerandu"]
# Asking for a technician / registration outright.
