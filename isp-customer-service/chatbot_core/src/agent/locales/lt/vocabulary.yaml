# --- agent/endpoint.py (E2 semantic turn-taking) ------------------------------

# An utterance whose LAST word is in this list is an unfinished thought
# ("nedega, bet…", "patikrinau ir…") — the endpointer waits longer, never cuts
# the caller mid-sentence.
continuation_words: ["bet", "ir", "o", "tai", "nes", "kad", "kai", "arba", "tada", "dar", "gal", "nu", "na", "taigi", "vadinasi", "pavyzdžiui", "į", "iš", "su", "prie", "ant", "per", "apie"]

# --- agent/resolution.py: words inside the readers -----------------------------

# A standalone "ne" — a denial in almost every reader.
bare_no: "\\bne\\b"
# A whole reply that is just "ne".
bare_no_replies: ["ne", "ne."]
# "jo" only as a standalone word — as a substring it matched "nepadėjo"/"jos"
# (live 2026-09-11 / S6) and flipped a NO report to YES.
bare_yes_jo: "\\bjo\\b"
# have_device reads CLAUSE BY CLAUSE ("neturiu kito routerio, aš tik kompiuterį turiu").
clause_split: "[,;]| bet | tačiau "
# A clause naming a device is denied by these words (first = the plain denial).
device_denial: ["neturiu", "nėra"]
# address confirm: any "ne-" word is a denial ...
negated_word: "\\bne\\w*"
# ... unless it negates the PROBLEM ("neveikia", "nėra interneto"), not the address.
problem_negations: ["neveik", "nevyk", "nėra", "nera", "netur", "nebeveik", "nebėr", "neber"]
address_yes: ["taip", "tvirtinu", "to adreso", "dėl šio", "del sio", "aha", "jo"]
# A word starting with these is negated ("NEregistruokite" is not a ticket demand).
negation_prefixes: ["ne", "nebe"]
# "Ačiū, nereikia" / "nebereikia" = polite done-signal (live 2026-08-13).
no_longer_needed: ["nebereikia"]
not_needed: ["nereikia"]
thanks_words: ["ačiū", "aciu"]
# "iki"/"ate" are goodbyes only as the LAST word or leading a farewell phrase
# ("iki pasimatymo") — as a preposition "iki" is content ("iki galo", "iki 17 valandos").
standalone_goodbye: ["iki", "ate"]
goodbye_followers: ["pasimatymo", "viso", "gero", "ate", "iki"]
# A short closer carrying one of these is still going on, not leaving.
followup_marks: ["klausim", "dar ", "bet ", "problem", "taip", "tęs", "tes", "toliau", "nebaik"]
closing_done: ["viskas"]
# The pure-decline fallback: EVERY token a known closing word ("Ne daganiai 1." is content).
closing_words: ["ne", "viskas", "ačiū", "aciu", "gerai", "jau", "tiek", "nieko"]
# A question by its opening words (STT sticks '?' onto rising intonation).
question_openers: ["kas ", "kaip ", "kam ", "kodėl", "kodel", "negi"]

# --- agent/perceive/slots.py, decide/rules/identification.py, decide/rules/reply.py ---

# An explicit street WORD wakes the address reader during account-code mode.
street_words: ["gatv", " g.", "prospekt", "alėj", "alej", "aikšt"]
# "aš apie Žeimių gatvę nieko NESAKIAU" — a denial naming the heard street drops it.
street_denial: ["nesakiau", "nesakau", "ne apie"]
# The turn carries address evidence (with a digit, or one of these words).
address_words: ["gatv", " g.", "prospekt", "alėj", "aikšt", "kaim", "adres", "but"]
# The agent's last question asked for the address.
address_question_words: ["adres", "gatv", "namo", "numer", "but"]
# A reply that itself NAMES an address (a yes to "ar tikrai kitas adresas?").
address_named_words: ["gatv", " g.", "prospekt", "alėj", "kaim", "but"]
# Address material in a turn (never a "fruitless" turn) — plus the served-city stems.
address_content_words: ["gatv", " g.", "prospekt", "alėj", "alej", "aikšt", "kaim"]
# The served area's city stems (a city outside them is "not served").
served_city_stems: ["šiaul", "siaul"]
# Spelling by anchor words: "K kaip Kaunas".
spell_anchor: ["kaip"]
street_question_words: ["gatv"]
# Account-code mode: the caller has no code / is not a customer.
