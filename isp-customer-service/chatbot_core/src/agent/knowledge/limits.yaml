# Numeric behaviour limits — how many times, how long, how sure.
#
# Read with `limits.get("name")`. A plain number is the value; `{value, env}` names an
# environment variable that wins over the file when set (the dashboard sets some of
# them at runtime, so they are read on every use).

# --- Case steps ------------------------------------------------------------------

step_repeat_max: 3                  # kiek kartų tas pats žingsnis gali nuskambėti; paskui — kortelės `on_fail` arba meistras

# --- Problem gate and identification ----------------------------------------------
problem_gate_max_turns: {value: 4, env: GATE_MAX_TURNS}  # three prompts (U8), the fourth fruitless turn ends the call
account_code_miss_max: 2            # a heard code not in the database this many times -> the not-a-client close (U8)
problem_gate_scripted_asks: 3       # scripted asks, each explaining more (U8: ask, why, last chance)
problem_classifier_heard_tail: 3    # recent utterances given to the LLM problem classifier
problem_llm_commit_confidence: 0.8  # an LLM problem guess at or above this is taken without asking
problem_llm_confirm_confidence: 0.5 # at or above this the guess gets a confirm question
ident_max_empty_turns: {value: 4, env: IDENT_MAX_TURNS}  # empty address turns before closing
ident_warn_min_empty_turns: 2       # the "I need the address" warning comes at max(this, max - 2)
address_unrecognized_turns_max: 2   # unrecognised address turns before the account code is offered
address_resolve_failures_max: 3     # failed street/house lookups before the account-code rung
account_code_grace_turns: 2         # non-code turns before code mode quietly switches off
reopen_confirm_max_asks: 2          # unclear answers to the address-change confirm before dropping it
tts_stall_seconds: 3                # no first audio chunk within this -> abandon the socket, reconnect
tts_budget_seconds: 10              # total per sentence across reconnects before the sentence is lost
reply_max_chars: 280                # a longer reply is trimmed at its last full sentence
speak_max_tokens: 150               # generation cap for a spoken reply (~2 short sentences + a question)
# v3 6c (docs/review/PROMPTAI.md): parameters per LLM role. Reading the caller is not writing —
# at 0.3 the same sentence was read differently between runs (eval S4); the largest reading seen
# was 131 tokens. The spoken reply keeps a little variety, less than before.
speak_temperature: {value: 0.2, env: SPEAK_TEMPERATURE}
perception_temperature: {value: 0.0, env: PERCEPTION_TEMPERATURE}
perception_max_tokens: 200
# 3 = the longest honest chain one turn can need (wave 3): reflect the caller's action,
# read the line, then say what it showed. Each hop is a deterministic decide pass, no LLM.
plan_redecide_max: 3
# Kiek pasitikėti supratimo kvietimo perskaitytu atsakymu į ŠĮ klausimą (7 banga). Žemiau
# `reading_confirm_confidence` atsakymas neužskaitomas — perklausiama dviem pasirinkimais.
# Tarp jų: užskaitoma, bet atsakyme pakeliui patvirtinama („Supratau — lemputės nedega.").
reading_accept_confidence: 0.75
reading_confirm_confidence: 0.45
# Po kiek „pasimetimų" (`dialog.stuck_count`) telefoninis sprendimas baigiamas sąžiningai: su
# išvada, ką padarėm, ir meistru. Iki 7f bangos tai darė identifikacijos kopėčia — pasiūlydavo
# abonento kodą ir uždarydavo skambutį vedimo viduryje.
stuck_fix_gives_up: 3
# Po kiek TUŠČIŲ ėjimų (klientas nieko nepridėjo — nei fakto, nei veiksmo, nei klausimo) agentas
# pradeda vyniotis: pirma sąžiningai pasako, ko nepavyksta išsiaiškinti, ir duoda DAR VIENĄ šansą,
# ir tik tada registruoja. Tai ne ėjimų skaičius: klientas, kuris ieško ir pasakoja, gali ieškoti
# kiek reikia (Andrius, 2026-10-05).
stall_before_last_chance: 2
# Tyla nėra tuščias ėjimas (pirma reikia suprasti, KODĖL klientas tyli), bet ir ji negali tęstis
# amžinai: po tiek tylos ėjimų agentas irgi pasiūlo dar vieną šansą ir vyniojasi.
silence_before_last_chance: 2
# Kiek ėjimų laukiame ŠIO žingsnio, kol agentas perlipa į gilesnį repertuarą (kaip rasti + kodėl
# to reikia). Čia skaičiuojami visi ėjimai, nes tai apie AGENTO žodžius, ne apie kliento norą.
waits_before_help: 2
# Kiek paskutinių atsakymų laikom pakartojimo lange (žr. speak/postprocess.py::track_stuck).
reply_repeat_window: 3
reply_stop_chars: 200               # past this, a streamed reply ends at its next sentence end
side_topic_streak_max: 3            # side-topic turns in a row before the fixed "back to the issue" reply
wrap_content_turns_max: 2           # content turns in the inform wrap-up that still get an LLM reaction
nlu_street_match_threshold: 0.75    # registry match score that accepts a street
nlu_city_match_threshold: 0.85      # registry match score that accepts a city

# --- Understanding, evidence and procedures ---------------------------------------
understand_history_messages: 4      # history messages sent to the understanding pass
understand_facts_min_confidence: 0.6  # understanding facts below this are dropped
classifier_max_tokens: 150
# L1 (2026-10-05): kiek žodžių dar skaitom ŽODYNU, kai klausimas uždaras. Žodynas variklyje
# vis tiek yra pirmas (`modules.read_answer`), tad ilgesniam sakiniui modelis šaukiamas ne dėl
# atsakymo, o dėl to, kas pasakyta PAKELIUI („ne, bet kompiuterį turiu") — todėl riba vidurinė.
# 6b (2026-10-15, Andrius): 6 žodžiai — ta pati riba ir variklio skaitymui kitose fazėse.
fast_read_max_words: 6
# L2 (2026-10-05): ar žingsnio sakinys sakomas taip, kaip PARAŠYTAS kataloge. Kol kas 0 —
# įjungus matuota, kad kitos replikos modelio skaitymas pasikeičia (S6: bazė 5/5, su šiuo 0/5),
# nes kartu su žodžiais iškrinta ir patvirtinimas, ant kurio laikosi tolesnis skaitymas.
# Žr. docs/archive/review/FIX_PLAN.md „Banga 9". Įjungti: SCRIPTED_STEP_WORDS=1.
scripted_step_words: {value: 0, env: SCRIPTED_STEP_WORDS}
short_utterance_max_words: 3        # a farewell / bare negation / bare "done" is at most this long
case_fact_asks_max: 2               # asks of the same fact before it counts as unavailable
greeting_max_words: 4               # a longer opener is not small talk

# --- Closing -----------------------------------------------------------------------
closing_max_turns: 2                # closing turns before the call is complete
closing_llm_replies_max: 1          # closing replies written by the LLM; later ones use the fixed goodbye

# --- Analyst -----------------------------------------------------------------------
analyst_every_turns: 3              # turns between routine analyst reads (it also reads on demand)
analyst_history_messages: 60
analyst_active_question_min_asks: 2 # the active question is shown only after it was re-asked
analyst_signals_max: 3               # typed signals per read
analyst_confidence_floor: 0.6        # a less certain signal is dropped
analyst_max_tokens: 700

# --- Telemetry verdict ------------------------------------------------------------
crc_error_rate_threshold: 1.0       # CRC errors/min above this mean a damaged cable
reboot_flap_window_s: 600           # a port flap within this window counts as a real reboot

# --- Voice ----------------------------------------------------------------------------

# A tool call slower than this deserves the caller hearing something (knowledge/tools
# -> filler_key). Traced as `tool_slow`.
tool_slow_ms: {value: 1200, env: TOOL_SLOW_MS}
voice_checkin_after_s: {value: 35, env: VOICE_CHECKIN_AFTER_S}  # caller silence before the agent speaks
voice_checkin_question_s: {value: 12, env: VOICE_CHECKIN_QUESTION_S}  # …after a question (no task to do, F4)
closing_silence_s: {value: 5, env: CLOSING_SILENCE_S}   # no answer to „Ar dar kuo galiu padėti?" → goodbye, hang up
goodbye_hangup_after_s: {value: 1.5, env: GOODBYE_HANGUP_S}  # the goodbye has played → this pause → the line goes down
echo_overlap_threshold: 0.8         # token overlap with our own last words that reads as echo
barge_consent_max_words: 3          # a longer interruption is content, not a backchannel
# Pipecat voice: finish the phrase, then decide (PERZIURA §6 I-3, ROADMAP V2)
barge_finish_max_ms: {value: 1500, env: BARGE_FINISH_MAX_MS}   # the agent finishes its phrase, at most this long
barge_wait_transcript_ms: {value: 1200, env: BARGE_WAIT_MS}    # after the caller stops: no words by then → go on
barge_echo_overlap: 0.9            # stricter than echo_overlap_threshold: an answer repeats the question's words (G1)

# --- Contact record (D-14) ---------------------------------------------------------------
audio_retention_days_unidentified: {value: 30, env: AUDIO_RETENTION_DAYS_UNIDENTIFIED}  # privacy: days an unidentified caller's audio is kept
