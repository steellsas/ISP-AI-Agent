# Universal detector meanings (Phase 3.11): WHAT the caller's answers mean for each
# detector TYPE, handed to the LLM step classifier as the option definitions.
# Priority when classifying a step: the step's own `answers:` in the pack (most
# specific) → THIS file (the detector's universal meaning). The wording lives in the
# locale (detector.<name>.<key>); refining how the agent UNDERSTANDS callers is a
# locale/file edit, never code. The code keeps only the MECHANISM.
#
# Editing rules of thumb (learned from live calls):
#   - Spell out negation garbles: STT mangles "nedega" into "nede"/"neda" — a "ne-"
#     root must always read as the negative.
#   - Reporting a RESULT after an action ("įkišau", "ryšys yra, bet interneto nėra")
#     means the action was DONE — not "still doing".
#   - Engagement is consent: "lauksiu skambučio" accepts the registration.

detectors:
  yes_no:
    "yes": "detector.yes_no.yes"
    "no": "detector.yes_no.no"
  lights:
    "yes": "detector.lights.yes"
    "no": "detector.lights.no"
  restored:
    "yes": "detector.restored.yes"
    "no": "detector.restored.no"
  reboot_check:
    "yes": "detector.reboot_check.yes"
    "no": "detector.reboot_check.no"
  scope:
    all: "detector.scope.all"
    one: "detector.scope.one"
    phone: "detector.scope.phone"
    computer: "detector.scope.computer"
  conn:
    wifi: "detector.conn.wifi"
    wired: "detector.conn.wired"
  port:
    wan: "detector.port.wan"
    lan: "detector.port.lan"
  have_device:
    "yes": "detector.have_device.yes"
    "no": "detector.have_device.no"
  instruct_done:
    done: "detector.instruct_done.done"
    waiting: "detector.instruct_done.waiting"
  ticket_consent:
    "yes": "detector.ticket_consent.yes"
    "no": "detector.ticket_consent.no"
