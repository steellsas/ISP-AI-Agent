# Identification policy — DECLARATIVE knobs, not code (Phase 3.8 step 5d).
#
# The identification PROCEDURE wording lives in prompts/partials/identification.md; the
# DIRECTION knobs a dev changes live here, so tuning identification (or adding an extra
# verification question) is a file edit. The engine reads these and reflects them in the
# identification guidance; the GUARDS stay in code and are NOT configurable here:
#   - technical tools blocked until identity is verified (tool gate),
#   - the apartment is never filled in from the DB (anti address-probing),
#   - a phone-fallback account's street must match what the caller said.
# Security boundaries must not depend on editable text.

identification:
  # Offer the caller's registered address FIRST (the number is already tied to it, so it
  # reveals nothing new and skips STT-fragile dictation). false → always ask them to state it.
  offer_phone_address: true

  # Require the apartment to disambiguate a block of flats. The apartment is still NEVER
  # taken from the DB — it must be spoken; this only says whether it is needed at all.
  require_apartment: true

  # Ask WHO is calling once the address is confirmed (2026-07-31, Andrius): the name
  # + relation to the contract strengthen identification confidence and land in the
  # call record ("kas skambino"). STILL not an identity gate — we serve the holder AND
  # family / tenants / helpers, a mismatch is expected and never blocks (5d rule).
  ask_caller: true

  # EXTRA things the agent asks while identifying. Empty = address only.
  # Add e.g. [name] to also ask the CALLER's name; [name, contact_phone] to also collect a
  # callback number. The WORDING is in `questions` below.
  # IMPORTANT — the name is for the RECORD, NOT identity verification. We serve the contract
  # holder AND family / tenants / a neighbour or friend helping out, so the caller's name
  # NEED NOT match the account: a mismatch is expected and fine (they will say "duktė",
  # "kaimynas"). Do NOT add a name-match guard. The ADDRESS is the identity anchor; the
  # caller's name is captured for the call record / history (Phase 3.10), never compared.
  extra_questions: []

  questions:
    name: "O kaip į jus kreiptis — koks jūsų vardas?"
    caller: "O su kuo kalbu — koks jūsų vardas? Ar jūs sutartį sudaręs asmuo?"
    contact_phone: "Kokiu numeriu geriausia su jumis susisiekti, jei nutrūktų ryšys?"

  # SCRIPTED identification replies (2026-07-31): the mechanical ladder turns are
  # COMPOSED by the ENGINE from these phrases — the LLM kept reordering/skipping them
  # (promised a check without the result, relapsed into confirm rounds, skipped the
  # caller question). Editing the wording is an edit HERE; {placeholders} are filled
  # from state. Scope: IDENTIFICATION ONLY — troubleshooting and free dialogue stay
  # with the LLM, and an off-script caller turn (a question) falls back to the LLM.
  phrases:
    anamnesis_question: "Supratau. O kada pastebėjote, kad dingo internetas — gal po ko nors, pavyzdžiui, audros ar remonto?"
    address_offer: "Ačiū. Kad galėčiau patikrinti situaciją, ar skambinate dėl {adresas}?"
    address_ask: "Ačiū. Kad galėčiau patikrinti situaciją iš tiekėjo pusės, pasakykite adresą, kuriuo neveikia internetas."
    echo_address: "Supratau — {adresas}."
    check_result: "Patikrinau ryšį iki jūsų buto. {zinia}"
    billing_extra: "Apmokėjus sąskaitą, paslauga bus įjungta."
    anything_else: "Ar dar kuo galiu padėti?"
    thanks: "Ačiū!"
    confirm_end: "Ar tikrai norite baigti pokalbį? Jei norite, galiu užregistruoti gedimą, kad kolegos su jumis susisiektų."
    goodbye: "Ačiū, kad paskambinote. Geros dienos!"
