# GEDIMO PAKETAS (docs/FAULT_PACKS.md): vienas failas = vienas gedimas.
verdict: foreign_mac
meta:
  title: "Nėra interneto — pakeistas/prijungtas kitas įrenginys (svetimas MAC)"
  domain: internet
  # R4b (2026-08-13): solveris vairuoja — analizė iš evidence, vykdymas per
  # žingsnių medį (sprendimai: tada:walker). Rollback = ištrinti šią eilutę.
  driver: solver
problem: internet_down
playbook: troubleshooting/internet_pakeistas_routeris_mac
# Analizės žinios (A variantas, 2026-08-13): faktų žodynas percepcijai +
# hipotezės logika. Žingsnių medis kol kas lieka vieninteliu vairuotoju;
# sprendimai (tada: bind) prisijungs kartu su solverio centralizavimu (R4b).
evidence:
  client:
    changed_device:
      label_key: "pack.foreign_mac.changed_device.label"
      value_label_keys:
        keite: "pack.foreign_mac.changed_device.values.keite"
        nekeite: "pack.foreign_mac.changed_device.values.nekeite"
      goal: "ar klientas neseniai keitė routerį arba prijungė naują įrenginį prie linijos"
      question_key: "pack.foreign_mac.changed_device.question"
      why_key: "pack.foreign_mac.changed_device.why"
      simpler_key: "pack.foreign_mac.changed_device.simpler"
      clarify_key: "pack.foreign_mac.changed_device.clarify"
      answers:
        keite: [keičiau, keiciau, keciau, pakeičiau, pakeiciau, "naują routerį", nusipirkau, prijungiau, pajungiau, keitėm, keitem]
        nekeite: [nekeičiau, nekeiciau, "nieko nekeit", "nieko naujo", neprijungiau, nepajungiau, "nieko nedariau"]
    cable_port:
      label_key: "pack.foreign_mac.cable_port.label"
      value_label_keys:
        wan: "pack.foreign_mac.cable_port.values.wan"
        lan: "pack.foreign_mac.cable_port.values.lan"
      goal: "į kurį routerio lizdą įkištas iš sienos ateinantis interneto kabelis — WAN ar LAN"
      question_key: "pack.foreign_mac.cable_port.question"
      why_key: "pack.foreign_mac.cable_port.why"
      simpler_key: "pack.foreign_mac.cable_port.simpler"
      clarify_key: "pack.foreign_mac.cable_port.clarify"
      answers:
        wan: [wan, internet, interneto, mėlyn, melyn, atskir]
        lan: [lan, geltona, geltoname, kitas, kitą, "prie kitų"]
      when: [changed_device=nekeite]
  # Hipotezė (linijoje kitas įrenginys) — TELEMETRIJOS faktas, patvirtinta nuo
  # pat pradžių; kliento faktai parenka SPRENDIMĄ, ne hipotezę.
  confirmed_when: []
  refuted_when: []
# pasiulymas — IŠVADOS MOMENTO scenarijus naratoriui (2026-08-21): žodis
# „pririšiu", ne „užregistruosiu" — registravimo žodžiai reiškia TIKETĄ, o čia
# tik įrenginio pririšimas prie linijos.
offer_goal: "Pasakyk, kad linijoje matome naują įrenginį — tai jų routeris. Jei klientas keitė routerį: pasakyk, kad dabar PRIRIŠI jį prie linijos (sakyk „pririšiu“, niekada „užregistruosiu“) ir paprašyk akimirką palaukti. Jei nekeitė — paklausk, į kurį lizdą įkištas kabelis iš sienos."
solutions:
- when: [changed_device=keite]
  action: procedure
  step_role: bind_device
  description_key: "pack.foreign_mac.solution.s1"
- when: [changed_device=nekeite, cable_port=lan]
  action: procedure
  step_role: move_cable_to_wan
  description_key: "pack.foreign_mac.solution.s2"
- when: [changed_device=nekeite, cable_port=wan]
  action: procedure
  step_role: bind_device
  description_key: "pack.foreign_mac.solution.s3"
steps:
- id: confirm_change
  role: confirm_device_change
  kind: confirm
  rag_section: 0
  'on':
    'yes': bind_mac
    'no': cable_check
  hint: 'Tell the caller plainly that the line shows a new/other device and that is why there is no
    internet, then ask whether they recently changed or connected a device — a new router, or a PC/TV
    plugged straight into the line (a valid temporary bridge). If YES -> we bind it. If they changed
    NOTHING -> do NOT escalate: the line cable reaches their own flat, so the device is almost certainly
    theirs; move on to checking how the cable is plugged (next step).'
  answers:
    'yes': klientas keitė routerį arba prijungė naują įrenginį
    'no': klientas nieko nekeitė ir nieko naujo neprijungė
- id: cable_check
  role: check_cable_port
  kind: confirm
  detector: port
  rag_section: 1
  'on':
    wan: bind_mac
    lan: cable_reconnect
  hint: 'The caller changed nothing, so the foreign/jumping MAC is usually a mis-plugged cable. Ask
    ONE thing and WAIT: which port is the incoming provider cable in — the Internet/WAN port (usually
    separate, labelled ''Internet'' or ''WAN''), or another (LAN) port? Ask by port FUNCTION, not
    colour. Do NOT conclude ''teisingas lizdas'' until they clearly say WAN or LAN; if unclear, ask
    again — do not rush.'
  answers:
    wan: kabelis įkištas į interneto (WAN) lizdą
    lan: kabelis įkištas į kitą (LAN) lizdą
- id: cable_reconnect
  role: move_cable_to_wan
  kind: instruct
  rag_section: 2
  hint: 'The cable is in the wrong (yellow LAN) port. Give ONE instruction and wait: unplug it and
    plug it into the blue WAN port, and say when done. Do NOT suggest rebooting — it changes nothing
    if the cable is misplugged.'
- use: bind_mac
  as: bind_mac
  role: bind_device
  rag_section: 3
  hint: 'The engine binds the device silently — you do NOT call the tool. Announce it naturally:
    ''Dabar pririšiu jūsų naujai matomą įrenginį — turėtų atsirasti internetas. Palaukite
    akimirką.'' Do NOT ask yet whether it works — that is the next step. (The anamnesis question
    was already asked at the START of the call — do not repeat it here.)'
- id: confirm_restored
  role: verify_restored
  kind: confirm
  rag_section: 4
  hint: The device is ALREADY bound. ASK whether the internet is back now ('ar internetas jau atsirado?')
    and wait. Do NOT say you 'will' bind, do NOT say it is 'not yet bound', do NOT re-explain that
    another device is on the line — that is done. Do NOT declare it fixed yourself. If not yet, reassure
    it may take a minute or two and ask them to check again.
- use: verify_restored
  as: client_side
  role: client_side_check
  rag_section: 5
  'on':
    success: resolve
    failure: escalate
  hint: The provider side is restored (telemetry OK) but the caller still has no internet, so the
    fault is INSIDE their home — Wi-Fi off, device settings, or the cable to the device. Guide ONE
    simple client-side check (restart the device, check Wi-Fi is on, try a cable straight into the
    device) and ask if it works now. If yes -> resolved; if not -> register the fault.
  answers:
    'yes': internetas dabar veikia
    'no': internetas vis dar neveikia
- id: escalate
  role: escalate
  kind: escalate
  tools: []
  hint: Binding did not restore the line (or the in-home checks did not help). Register the fault
    for a technician check ('gedimo registracija') — a worker will call the next business day.
