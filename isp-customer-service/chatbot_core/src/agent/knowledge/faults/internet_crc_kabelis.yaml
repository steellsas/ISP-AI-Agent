# GEDIMO PAKETAS (docs/FAULT_PACKS.md): vienas failas = vienas gedimas.
#
# NT1 (Andrius 2026-09-11): linija gyva, bet daug CRC klaidų — pažeistas arba
# atsilaisvinęs laidas. Vienas pigus patikrinimas su klientu (perkišti laidą
# ABIEJUOSE galuose), variklis perskaito CRC iš naujo; nepadėjo — meistras
# keis laidą.
verdict: crc_errors
meta:
  title: "Internet drops out / slow — many CRC errors on the line (damaged cable)"
  domain: internet
problem: internet_down
playbook: troubleshooting/internet_crc_kabelis
# The symptom the caller can see — asked when a recheck points here (D-05).
confirm_key: "pack.crc_errors.confirm"
evidence:
  client: {}
  confirmed_when: []
  refuted_when: []
ticket_need_key: "pack.crc_errors.ticket_need"
conclusion_key: "pack.crc_errors.conclusion"
# Telemetry alone confirms the fault (confirmed_when: []); the one solution starts the
# procedure at the ability check.
solutions:
- when: []
  action: procedure
  step_role: ability_check
  description_key: "pack.crc_errors.solution.s1"
steps:
- id: crc_ability
  role: ability_check
  kind: confirm
  detector: yes_no
  rag_section: 0
  goal: "clear whether the customer can get to the router RIGHT NOW"
  'on':
    'yes': crc_cable
    'no': crc_homework
    lost: crc_locate
  hint: "Explain in ONE short sentence what you see — the line works but carries a lot of errors, which usually means a damaged or loose cable — then ONE question and WAIT: can they get to the router right now? Length model: <<examples:crc_errors/crc_ability>>"
  answers:
    'yes': "pack.crc_errors.steps.crc_ability.answers.yes"
    'no': "pack.crc_errors.steps.crc_ability.answers.no"
    lost: "pack.crc_errors.steps.crc_ability.answers.lost"
- id: crc_locate
  role: locate_device
  kind: confirm
  detector: yes_no
  rag_section: 0
  goal: "the customer found the router"
  'on':
    'yes': crc_cable
    'no': crc_homework
  hint: 'They do not know where the router is. Describe it simply and ask if they can see it: a
    small box with little lights; the internet cable runs into it.'
  answers:
    'yes': "pack.crc_errors.steps.crc_locate.answers.yes"
    'no': "pack.crc_errors.steps.crc_locate.answers.no"
- id: crc_homework
  role: homework
  kind: confirm
  detector: yes_no
  rag_section: 0
  goal: "agreed: when back, they reseat the internet cable at the router, and call if it does not help"
  'on':
    'yes': callback
    'no': escalate
  hint: "They cannot check now — homework warmly, then consent: when back, firmly reseat the internet cable AT THE ROUTER (we do not know how their wiring runs, so never mention wall sockets or both ends); if it still misbehaves — call again and we will register a cable replacement. Length model: <<examples:crc_errors/crc_homework>>"
  answers:
    'yes': "pack.crc_errors.steps.crc_homework.answers.yes"
    'no': "pack.crc_errors.steps.crc_homework.answers.no"
- id: crc_cable
  role: reseat_cable
  kind: instruct
  rag_section: 1
  goto: crc_recheck
  hint: 'ONE instruction, then wait: firmly reseat the internet cable AT THE ROUTER — pull the
    cable that comes in from outside out of the router''s internet port and push back until it
    clicks. Do NOT tell them to reseat "both ends" — we do not know their wiring (the UTP may run
    straight out of the wall). While they are at it, ask whether the cable shows any visible
    damage (a kink, a pinch, a chewed spot). Say when done.'
- id: crc_recheck
  role: verify_line
  kind: confirm
  detector: restored
  rag_section: 2
  goal: "clear whether the errors are gone after the reseat (the engine re-reads the line)"
  'on':
    'yes': resolve
    'no': escalate
  hint: 'They reseated the cable. The ENGINE silently re-reads the line errors — do not declare
    success yourself. Ask ONE thing: does the internet behave now? The engine blends their answer
    with the fresh reading.'
  answers:
    'yes': "pack.crc_errors.steps.crc_recheck.answers.yes"
    'no': "pack.crc_errors.steps.crc_recheck.answers.no"
- id: escalate
  role: escalate
  kind: escalate
  tools: []
  rag_section: 3
  hint: "The errors persist after the reseat — even if reseating had helped a little, a damaged cable is a TEMPORARY state, so the fault gets registered: a technician will replace the cable. Say it honestly; say you WILL register — <<examples:common/register_future>>. Include any visible damage the caller mentioned on the ticket note."
