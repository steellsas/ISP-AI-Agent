# GEDIMO PAKETAS (docs/FAULT_PACKS.md): vienas failas = vienas gedimas.
#
# NT (Andrius 2026-09-11): porto ryšys nutrūkęs, KAIMYNAI veikia — gedimas
# kliento atkarpoje (kabelis laiptinė→butas arba routerio WAN pusė). Eiga:
# hipotezės transliacija → ar gali prieiti DABAR (ability) → lemputės (dega =
# routeris gyvas) → perkišti iš sienos ateinantį laidą → VARIKLIS perskaito
# portą (ll_recheck) → neatsikėlė, o routeris gyvas → sąžininga išvada:
# tikėtinas kabelio pažeidimas trasoje, vyksta meistras.
verdict: link_down_local
meta:
  title: "No internet — the port link is down while the neighbours work (cable to the flat)"
  domain: internet
problem: internet_down
playbook: troubleshooting/internet_linija_nutrukusi
evidence:
  client: {}
  confirmed_when: []
  refuted_when: []
ticket_need_key: "pack.link_down_local.ticket_need"
conclusion_key: "pack.link_down_local.conclusion"
# Telemetry alone confirms the fault (confirmed_when: []); the one solution starts the
# procedure at the ability check.
solutions:
- when: []
  action: procedure
  step_role: ability_check
  description_key: "pack.link_down_local.solution.s1"
steps:
- id: ll_ability
  role: ability_check
  kind: confirm
  detector: yes_no
  rag_section: 0
  goal: "clear whether the customer can get to the router RIGHT NOW"
  'on':
    'yes': ll_lights
    'no': ll_homework
    lost: ll_locate
  hint: "Explain in ONE short sentence what you see — the connection to their flat is down while the neighbours are fine, so it is most likely the cable or a connector on their side — then ONE question and WAIT: can they get to the router right now? Length model: <<examples:link_down_local/ll_ability>>"
  answers:
    'yes': "pack.link_down_local.steps.ll_ability.answers.yes"
    'no': "pack.link_down_local.steps.ll_ability.answers.no"
    lost: "pack.link_down_local.steps.ll_ability.answers.lost"
- id: ll_locate
  role: locate_device
  kind: confirm
  detector: yes_no
  rag_section: 0
  goal: "the customer found the router"
  'on':
    'yes': ll_lights
    'no': ll_homework
  hint: 'They do not know where the router is. Describe it simply and ask if they can see it: a
    small box with little lights, usually in the hallway or by a window; the internet cable from
    the stairwell runs into it.'
  answers:
    'yes': "pack.link_down_local.steps.ll_locate.answers.yes"
    'no': "pack.link_down_local.steps.ll_locate.answers.no"
- id: ll_homework
  role: homework
  kind: confirm
  detector: yes_no
  rag_section: 0
  goal: "agreed: when back, they reseat the cable, and call if it does not recover"
  'on':
    'yes': callback
    'no': escalate
  hint: "They cannot check now — homework warmly, then consent: when back, firmly reseat the cable that comes from the wall into the router; if the internet does not return — call again and we will register a technician, the fault looks like the cable run. Length model: <<examples:link_down_local/ll_homework>>"
  answers:
    'yes': "pack.link_down_local.steps.ll_homework.answers.yes"
    'no': "pack.link_down_local.steps.ll_homework.answers.no"
- id: ll_lights
  role: check_lights
  kind: confirm
  detector: lights
  rag_section: 1
  goal: "clear whether the router is alive (at least one light is on)"
  'on':
    'yes': ll_wan
    'no': ll_power
  hint: 'They are at the router. ONE question and WAIT: is ANY light on? Lights ON means the router
    is alive and the fault sits in the line — exactly what the telemetry suggests.'
  answers:
    'yes': "pack.link_down_local.steps.ll_lights.answers.yes"
    'no': "pack.link_down_local.steps.ll_lights.answers.no"
# Aiškus simptomas (Andrius 2026-09-11): routeris gyvas, bet INTERNETO/WAN
# lemputė nedega — signalas iš linijos neateina; tai patvirtina hipotezę.
- id: ll_wan
  role: check_wan_light
  kind: confirm
  detector: lights
  rag_section: 1
  goal: "clear whether the INTERNET (WAN) light is on — the sign of a signal from the line"
  'on':
    'yes': ll_cable
    'no': ll_cable
  hint: "The router is alive. ONE question and WAIT: is the INTERNET light (marked \"Internet\", \"WAN\" or a globe icon) on or blinking? If it is DARK — the signal from the line is not arriving, exactly the fault we see. Either way the next step is the cable reseat; when it is dark, SAY the meaning first: <<examples:link_down_local/ll_wan>>"
  answers:
    'yes': "pack.link_down_local.steps.ll_wan.answers.yes"
    'no': "pack.link_down_local.steps.ll_wan.answers.no"
- id: ll_power
  role: check_power
  kind: confirm
  detector: lights
  rag_section: 2
  goal: "power checked — clear whether the lights came on"
  'on':
    'yes': ll_cable
    'no': escalate
  hint: 'No lights — first make the router alive: check the power lead is firmly in the socket and
    in the router, try another socket, and ask whether any light came on. If still nothing, the
    router itself is dead too — register the fault (the line AND the device need a technician).'
  answers:
    'yes': "pack.link_down_local.steps.ll_power.answers.yes"
    'no': "pack.link_down_local.steps.ll_power.answers.no"
- id: ll_cable
  role: reseat_cable
  kind: instruct
  rag_section: 3
  goto: ll_recheck
  hint: 'The router is alive, the line is not. ONE instruction, then wait: firmly reseat the cable
    that comes from the wall/stairwell into the router''s internet port — pull it out, push back
    until it clicks — and say when done.'
- id: ll_recheck
  role: verify_line
  kind: confirm
  detector: restored
  rag_section: 4
  goal: "clear whether the line recovered after the cable reseat (the engine re-reads the port)"
  'on':
    'yes': resolve
    'no': escalate
  hint: 'They reseated the cable. The ENGINE silently re-reads the port — do not declare success
    yourself. Ask ONE thing: did the INTERNET light come on / did the internet come back? The
    engine blends their answer with the fresh port reading.'
  answers:
    'yes': "pack.link_down_local.steps.ll_recheck.answers.yes"
    'no': "pack.link_down_local.steps.ll_recheck.answers.no"
- id: escalate
  role: escalate
  kind: escalate
  tools: []
  rag_section: 5
  hint: "The router is alive but the internet light stays dark and the port stays down after the reseat — the signal is not arriving, most likely a damaged cable on the run (stairwell to flat). Say the CLEAR conclusion <<examples:link_down_local/escalate.conclusion>>, that a technician must come out, and say you WILL register — <<examples:common/register_future>>. The ticket note: router alive, WAN light dark, port down after reseat."
