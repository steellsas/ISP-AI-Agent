# The full diagnosis of one customer's line.
tool: diagnose_connection
capability: probe
adapter: demo_db
args: { customer_id: str }
# The facts this observation establishes (knowledge/signals.yaml). The gateway checks it:
# a tool that writes a fact it never declared is a contract break, traced as
# `returns_violation`.
returns: [service_suspended, area_outage, node_reachable, neighbours, line_link, line_errors,
          device_seen, device_registered, dhcp, traffic, port_flapped]
requires: [identified]
timeout_s: 8
filler_key: system.filler
on_failure:
  say_key: tools.unavailable_probe
  fallback: ask_client
  alert: ops
