# Inform verdicts (closing wave, Andrius 2026-09-08) — WHAT the caller hears about
# a debt, an outage or a provider-side fault lives in the locale, not in code.
#
# Each entry:
#   template_key          the phrase with {placeholders}; when data is missing the
#                         engine DROPS the sentences with empty fields, or falls back
#                         to `fallback_key` (or the verdict gloss) — never a lie.
#   fallback_key          what is said when the data is not enough for the template.
#   clarity_requirements  what the caller must know before the goodbye:
#                         what_is_wrong / what_to_do (or what_is_being_done) /
#                         when_restored / how_notified.
#
# Placeholders are filled from the diagnose signals:
#   debt:    {amount} (EUR), {months} ("liepą ir rugpjūtį"), {last_payment}
#            ("birželio 5 d."; the sentence is dropped when there was no payment)
#   outage:  {location} (street/description), {eta} (HH:MM)

billing_suspended:
  template_key: "inform.billing_suspended.template"
  fallback_key: "inform.billing_suspended.fallback"
  clarity_requirements: [what_is_wrong, what_to_do, when_restored]

active_outage:
  template_key: "inform.active_outage.template"
  fallback_key: "inform.active_outage.fallback"
  clarity_requirements: [what_is_wrong, what_is_being_done, when_restored, how_notified]

node_fault_unregistered:
  template_key: "inform.node_fault_unregistered.template"
  clarity_requirements: [what_is_wrong, what_is_being_done, how_notified]

switch_unreachable:
  template_key: "inform.switch_unreachable.template"
  clarity_requirements: [what_is_wrong, what_is_being_done, how_notified]
