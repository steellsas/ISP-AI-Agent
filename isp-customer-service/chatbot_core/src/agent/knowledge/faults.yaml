# Fault knowledge — DECLARATIVE, not code (Phase 3.8 step 5b/5c).
#
# A new fault should be an entry HERE + a playbook .md + seed data + an eval scenario.
# Two sections, because they answer two different questions:
#
#   problems: — the call's PURPOSE, i.e. what the CALLER reports ("neveikia" vs "lėtai").
#               `triggers` are matched against the utterance; ORDER MATTERS (a more
#               specific problem must come before a broader one).
#   faults:   — a CAUSE the telemetry can reach, and how to resolve it:
#               `problem`   which reported problem it explains
#               `playbook`  the RAG doc holding each step's WORDING
#               `steps`     the procedure: id, kind, detector, routing (`on`), rag_section,
#                           the LLM hint, and `answers` = what each routing key MEANS
#                           (what the classifier must detect in the caller's reply).
#
# The engine keeps SAFETY: which actions may run, the identity gate, executing a
# bind/ticket/close. Knowledge says what to do; code guarantees what cannot be done.
# A missing/broken entry is fail-soft — the engine falls back to its in-code defaults.

problems:
  internet_slow:
    triggers:
    - lėtas
    - lėtai
    - lėta
    - stringa
    - lūžinėja
    - buferiuoja
  tv:
    triggers:
    - televizij
    - televizor
    - ' tv'
    - kanalai
    - kanalų
  billing:
    triggers:
    - sąskait
    - mokė
    - skola
    - kaina
    - tarif
  internet_down:
    triggers:
    - internet
    - ryši
    - ryšys
    - neveikia
    - nėra interneto
    - wifi
    - wi-fi
# faults: persikėlė į knowledge/faults/ katalogą — VIENAS FAILAS = VIENAS GEDIMAS
# (docs/FAULT_PACKS.md). Čia liko tik `problems` klasifikacija; katalogo paketas
# visada nugali to paties verdikto įrašą šiame faile.
faults: {}
