# KNOWN ANSWERS to side-topic questions (side_topic node, 2026-08-07).
# A new topic = a new entry HERE (plus its locale words and answer), not code.
# `keywords_vocab` names a vocabulary list matched as lower-case substrings of the
# caller's phrase; on a match the `answer_key` phrase is the ONLY content the LLM
# may give on that question. No match — the agent politely says it is not its
# area and returns to the fault.

faq:
  - topic: price
    keywords_vocab: faq_keywords_price
    answer_key: "faq.price"
  - topic: debt_amount
    keywords_vocab: faq_keywords_debt_amount
    answer_key: "faq.debt_amount"
    # Jei skolos žinia šiame skambutyje jau pasakyta, suma jau nuskambėjo — tada atsakom iš
    # tų pačių faktų (`inform.yaml: asked_again_key`), o ne „nematau".
    answer_from_news: billing_suspended
  - topic: duration
    keywords_vocab: faq_keywords_duration
    answer_key: "faq.duration"
  - topic: technician
    keywords_vocab: faq_keywords_technician
    answer_key: "faq.technician"
  - topic: working_hours
    keywords_vocab: faq_keywords_working_hours
    answer_key: "faq.working_hours"
