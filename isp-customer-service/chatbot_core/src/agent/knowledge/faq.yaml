# ŽINOMI ATSAKYMAI šalutiniams klausimams (side_topic node, 2026-08-07).
# Nauja tema = naujas įrašas ČIA, ne kodas. `raktazodziai` — substring match
# (mažosiomis) prieš kliento frazę; sutapus, `atsakymas` paduodamas LLM'ui kaip
# VIENINTELIS leidžiamas turinys tuo klausimu. Nesutapus niekam — agentas
# mandagiai pasako, kad tai ne jo sritis, ir grįžta prie gedimo.

faq:
  - tema: kaina
    raktazodziai: [kainuo, kaina, mokam, mokėti, moketi, sumokė, apmokestin]
    atsakymas: "faq.kaina"
  - tema: skolos_suma
    raktazodziai: [skol, sąskait, saskait, suma]
    atsakymas: "faq.skolos_suma"
  - tema: kiek_uztruks
    raktazodziai: [užtruks, uztruks, ilgai, greitai sutvarky]
    atsakymas: "faq.kiek_uztruks"
  - tema: meistras
    raktazodziai: [meistr, technik, atvažiuo, atvaziuo, vizit]
    atsakymas: "faq.meistras"
  - tema: darbo_laikas
    raktazodziai: [darbo laik, kada dirbat, iki keliu, iki kelių]
    atsakymas: "faq.darbo_laikas"
