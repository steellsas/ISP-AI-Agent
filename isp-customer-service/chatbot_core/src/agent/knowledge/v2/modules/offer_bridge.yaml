# LAIKINAS INTERNETAS — PASIŪLYMAS, ne žingsnis.
#
# Andrius (2026-09-30): „tuomet eitų pasiūlymas laikinai pajungti internetą ant vieno
# įrenginio, jei yra galimybė pajungti PC prie tinklo kabelio." Iki 6 bangos tiltas buvo
# vykdomas automatiškai — gyvai klientas gavo nurodymą perkišti laidą į kompiuterį, nors
# niekas neklausė nei ar jis to nori, nei ar kompiuterį turi.
module: offer_bridge
kind: ask
params:
  to: {values: [computer], default: computer}
ask: modules.offer_bridge.question
# Pasiūlymas priimamas ir žodžiu „gerai“ — `yes_no` to atsakymu nelaiko, ir gyvai
# (eval S4, 2026-09-30) klientas pasakė „Gerai“, o agentas pakartojo tą patį pasiūlymą.
#
# Nuo 7 bangos skaitytuvas yra `bridge_consent`: „neturiu", „tik telefonas" ir prašymas
# registruoti gedimą yra ATSISAKYMAS. Gyvai 2026-10-01 „Neturiu." šiam klausimui nereiškė
# nieko, o „noriu registruoti gedimą" buvo perskaityta kaip sutikimas.
detector: bridge_consent
answers:
  "yes": bridge_agreed=yes
  "no": bridge_agreed=no
produces: [bridge_agreed]
goal: "offered, not imposed: a temporary line into one device while the router is replaced"
# Nėra ko jungti — atsakymas jau žinomas, ir klausti nebereikia. Taip visi tilto žingsniai
# praleidžiami per savo `done_when: [bridge_agreed=no]`, nes kortelė nemoka sakyti „ARBA".
answered_when:
  - when: has_computer=no
    set: bridge_agreed=no
