# Variklio veiksmas: linijoje matomas įrenginys pririšamas prie kliento porto.
# Klientas neveikia nieko — naratorius tik paskelbia (kortelė to nekartoja).
module: bind
kind: action
params:
  device: {required: true}
tool: update_mac
goal: "the device seen on the line bound to the caller's port"
produces: [device_registered, traffic, port_flapped]
