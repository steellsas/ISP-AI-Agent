# Lemputės klausiamos KLIENTO, o ką jos reiškia — sako įrangos katalogas: „INTERNET
# raudona" (TP-Link) ir „LOS mirksi" (ONT) abi virsta wan_link=down.
module: check_lights
kind: ask
params:
  device: {required: true}
  light: {}                         # INTERNET | POWER | LOS | … tuščia = visos
# Lemputės patvirtina arba paneigia hipotezę (gyva dėžutė ar ne), ir linija to nemato — todėl
# šis klausimas neperšokamas net tada, kai klientas jau nuėjo į priekį (2026-09-30).
confirms: true
detector: lights          # nedega / dega / mirksi — reikšmę duoda įrangos katalogas
goal: "what the {device} lights show right now"
text: "equipment:{device}.lights"
produces: [wan_link, power]
