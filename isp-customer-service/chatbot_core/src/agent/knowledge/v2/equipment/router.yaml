# BAZINIS ROUTERIS — visada yra (P-8 hierarchija: modelis → šeima → bazinis).
#
# Klientas gali turėti savo pirktą įrenginį, o CRM gali jo nežinoti. Todėl agentas niekada
# nepasiduoda: nerastas modelis reiškia šeimą, nerasta šeima — šitą failą. Čia tik SAUGŪS,
# universalūs veiksmai (jokio gamyklinio reset'o, jokių konkrečių mygtukų vietų).
#
# Struktūra čia, sakiniai — lokalėje (phrases.yaml `equipment:`), kaip ir visur kitur.
equipment: router
type: router
name_key: equipment.router.name
locate_key: equipment.router.locate

# Ką klientas gali padaryti su šiuo įrenginiu ir kaip tai pasakoma.
actions:
  reboot.power: equipment.router.reboot.power
  cable.reseat: equipment.router.cable.reseat

# Lemputė → faktas. Kortelės nežino modelių: „INTERNET raudona" (TP-Link) ir „LOS mirksi"
# (ONT) abi virsta wan_link=down, ir kortelė kalba tik apie wan_link.
lights:
  power:
    ask_key: equipment.router.lights.power
    means: {"on": power=yes, "off": power=no}
  internet:
    ask_key: equipment.router.lights.internet
    means: {green: wan_link=up, red: wan_link=down, "off": wan_link=down}
