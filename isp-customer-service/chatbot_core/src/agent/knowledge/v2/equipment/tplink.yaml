# TP-LINK ŠEIMA — CRM demo duomenyse visi klientų routeriai yra TP-Link Archer
# (C6, C80, AX10, AX23, AX73). Paveldi bazinį routerį ir perrašo TIK tai, kas skiriasi:
# lemputės vadinasi kitaip ir yra mygtukas.
#
# Gamintojo klausiama tik tada, kai instrukcija skiriasi nuo bazinės; maitinimo
# perkrovimas universalus, tad jo čia nėra — paveldimas.
equipment: tplink
type: router
extends: router
matches: [tp-link, tplink, archer]

actions:
  reboot.button: equipment.tplink.reboot.button

lights:
  internet:
    # TP-Link lemputė turi savo vietą ir užrašą — klausimas tikslesnis.
    ask_key: equipment.tplink.lights.internet
    # 4b banga: SPALVA yra tikslesnis atsakymas už „dega / nedega", ir tik gamintojas žino,
    # ką ji reiškia. TP-Link Archer: žalia — ryšys yra; oranžinė — įrenginys gyvas, bet
    # interneto negauna; raudona — nėra signalo. Bazinis routeris spalvų nežino sąmoningai.
    means:
      green: wan_link=up
      orange: wan_link=down
      red: wan_link=down
      "yes": wan_link=up
      "no": wan_link=down
