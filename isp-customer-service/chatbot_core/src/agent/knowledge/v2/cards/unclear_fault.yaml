# NEAIŠKUS GEDIMAS (v2 kortelė, 3 banga)
#
# Technikas (Andrius, 2026-09-03): problema mūsų srities, klientas identifikuotas, bet
# kortelės jai nėra (pvz. TV) arba žinios baigėsi. Vienas sąžiningas escalate: gedimas
# registruojamas su „neaiškus gedimo tipas — perduota analizei". Tiketas maitina analizės
# ratą vietoje improvizacijos ne toje srityje.
#
# `fallback: true` — ši kortelė NIEKADA nekonkuruoja su tikra diagnoze: variklis ją ima
# tik tada, kai nė viena kita kortelė netinka.
fault: unclear_fault
service: any
explain:
  conclusion: "verdict.unclear_fault.gloss"

# Ši kortelė nieko neatitinka pagal sąlygas, tad pati neturi ką pasakyti apie liniją. Bet
# klientas TURI išgirsti, kas buvo patikrinta — kitaip „telefonu nenustatėme" skamba kaip
# „nieko nedariau" (Andrius, 2026-09-23).
# Tik MŪSŲ pusės faktai: „srautas iki routerio" televizijos skambutyje kalba apie routerį,
# o TV skambutyje apie jį kalbėti nereikia (eval T1).
explain_facts: [node_reachable, line_link]

fallback: true
when: {}

needs: {}

solution:
- when: []
  steps:
  - module: escalate
    args: {note: "neaiškus gedimo tipas — perduota analizei"}

escalate:
  need: "verdict.unclear_fault.ticket_need"

knowledge: troubleshooting/internet_no_connection
