# ROUTERIS ADRESO NEPRAŠO — pasimetę nustatymai (v2 kortelė, 4 banga)
#
# Telemetrija įrenginį linijoje MATO ir MAC tas pats, kuris registruotas, bet adreso iš mūsų
# jis net neprašo (DHCP tyli arba nuoma pasibaigusi). Praktikoje tai reiškia, kad routeris
# pamiršo savo nustatymus — dažniausiai po gamyklinio atstatymo. Telefonu to nesutvarkysime:
# reikia perkonfigūruoti, tai meistro darbas.
#
# Iki 4 bangos tai buvo `verdict.py::decide` medžio šaka (`dhcp_silent`), kurios nė viena
# kortelė neaprašė — todėl variklis ją vertė „neaiškiu gedimu". Dabar tai kortelė kaip visos
# kitos: pati pasako, kada ji kandidatė, ir pati pasako, kad telefonu nėra ko daryti.
#
# Klientui NIEKADA nesakom „DHCP" ar „gamyklinis atstatymas" (F-8 — be telemetrijos žargono):
# `explain.conclusion` ir faktų glosai pasakyti žmogaus kalba.
fault: dhcp_silent
service: internet
symptom: internet_down
explain:
  conclusion: "verdict.dhcp_silent.gloss"

# Kandidatė, kai tiekėjo pusė tvarkinga, įrenginys linijoje matomas — ir tyli.
when:
  all: [node_reachable=yes, line_link=up, device_seen=yes, dhcp=silent]

rules_out:
  - area_outage=yes           # avarija — informuojam
  - service_suspended=yes     # skola — informuojam
  # Kitas įrenginys linijoje: tada tylus DHCP yra tos kortelės dalis (naujas routeris dar
  # nepririštas), ne atskiras gedimas — S1 eval'e abu faktai sutampa.
  - device_registered=foreign
  - line_errors=high          # kabelio klaidos
# 4b banga: telefonu ČIA yra ką daryti — žinių bazėje surašytas algoritmas, kaip klientas pats
# susigrąžina internetą per routerio valdymo skydelį (`knowledge:` apačioje). `guide` modulis
# veda per jį po VIENĄ žingsnį; meistras registruojamas tik tada, jei nepavyko arba klientas
# negali, ir tiketas pasako, ką bandėme. Pakito TIK ši kortelė — variklis apie WAN nustatymus
# nieko nežino.
solution:
- steps:
  - module: reach
    args: {device: router}
    # Jei klientas jau prie routerio — neklausiam.
    done_when: [reachable=yes]
  - module: guide
    # Du dokumento žingsniai yra kliento rankose (prisijungti prie skydelio, nustatyti WAN);
    # trečiasis dokumento žingsnis („patikrinti") yra MŪSŲ patikra žemiau.
    args: {knowledge: troubleshooting/internet_factory_reset_dhcp, count: 2}
  - module: verify
    args:
      evidence: [dhcp=ok]
      ask: restored

escalate:
  need: "verdict.dhcp_silent.ticket_need"
  note: "routeris linijoje tyli — nustatymai pasimetę; su klientu eita per konfigūravimo žingsnius"
  # Meistras neturi atvykti to, ką klientas gali padaryti su instrukcija telefone.
  only_after: [guide]

knowledge: troubleshooting/internet_factory_reset_dhcp
