# TINKLAS IKI ROUTERIO VEIKIA — problema kliento pusėje (v2 kortelė, 3 banga)
#
# Telemetrija sako, kad srautas iki routerio vaikšto, o klientui internetas neveikia.
# Toliau klausimai atskiria, KUR problema: visuose įrenginiuose (routeris) ar viename
# (tas įrenginys), ir kaip tas įrenginys prisijungęs (kabelis ar Wi-Fi).
#
# v1: internet_kliento_puse.yaml, 267 eil., 13 žingsnių.
fault: healthy_to_router
service: internet
symptom: internet_down
# Tinklas iki kliento įrangos tvarkingas. Tai skaito paslauga, kuri JOJA ant kitos (IPTV per
# internetą): jei ši kortelė laikosi, televizija — savas gedimas; jei ne, pirma internetas
# (4 banga: anksčiau tą pasakydavo `verdicts.yaml` žymė per ištrintą medį).
line_ok: true
explain:
  conclusion: "verdict.healthy_to_router.gloss"
  confirm: "pack.healthy_to_router.confirm"

when:
  all: [node_reachable=yes, line_link=up, traffic=flowing]

rules_out:
  - area_outage=yes
  - service_suspended=yes
  - device_registered=foreign
  - line_errors=high
  # Jei linijoje jokio įrenginio nematome, „tinklas iki routerio veikia" neturi prasmės —
  # tai miręs routeris (S4 eval'e ši kortelė konkuravo su no_mac_observed ir laimėdavo).
  - device_seen=no
  # Įrenginys adreso net neprašo: srautas linijoje gali vaikščioti, bet kliento pusė čia
  # nekalta — tai routerio nustatymų kortelė (dhcp_silent).
  - dhcp=silent

needs:
  fail_scope:
    ask: "pack.healthy_to_router.fail_scope.question"
    why: "pack.healthy_to_router.fail_scope.why"
    clarify: "pack.healthy_to_router.fail_scope.clarify"
    values:
      all: confirms
      one: confirms
    answers:
      "all": answers_healthy_to_router_fail_scope_all
      "one": answers_healthy_to_router_fail_scope_one
  fail_device:
    ask: "pack.healthy_to_router.fail_device.question"
    when: [fail_scope=one]
    values: {phone: confirms, computer: confirms}
    answers:
      "phone": answers_healthy_to_router_fail_device_phone
      "computer": answers_healthy_to_router_fail_device_computer
  connection_type:
    ask: "pack.healthy_to_router.connection_type.question"
    when: [fail_device=computer]
    why: "pack.healthy_to_router.connection_type.why"
    values: {wired: confirms, wifi: confirms}
    answers:
      "wired": answers_healthy_to_router_connection_type_wired
      "wifi": answers_healthy_to_router_connection_type_wifi
  rebooted:
    ask: "pack.healthy_to_router.rebooted.question"
    when: [fail_scope=all]
    why: "pack.healthy_to_router.rebooted.why"
    clarify: "pack.healthy_to_router.rebooted.clarify"
    values: {"yes": confirms, "no": confirms}
    answers:
      "yes": answers_healthy_to_router_rebooted_yes
      "no": answers_healthy_to_router_rebooted_no

solution:
# Neveikia visur, routeris dar neperkrautas — perkrovimas yra pigiausias žingsnis.
- when: [fail_scope=all, rebooted=no]
  steps:
  - module: reach
    args: {device: router}
  - module: reboot
    args: {device: router, method: power}
  - module: verify
    args:
      evidence: [traffic=flowing]
      ask: restored
# Neveikia visur, jau perkrovė — telefonu nebeliko ko daryti.
- when: [fail_scope=all, rebooted=yes]
  steps:
  - module: escalate
    args: {note: "klientas jau perkrovė routerį, tinklas iki routerio veikia"}
# Telefonas / planšetė: Wi-Fi tas įrenginys.
- when: [fail_device=phone]
  steps:
  - module: device_check
    args: {device: phone, what: wifi}
    # Nepadėjo — tada prijungiam iš naujo. Tai `on_fail`, ne eilinis žingsnis: kitaip agentas
    # prašo prisijungti iš naujo net tada, kai internetas jau veikia (S9 eval'e).
    on_fail:
      module: device_check
      args: {device: phone, what: reconnect}
  - module: verify
    args: {ask: restored}
# Kompiuteris kabeliu: laidas iki įrenginio.
- when: [connection_type=wired]
  steps:
  - module: device_check
    args: {device: computer, what: cable}
  - module: verify
    args: {ask: restored}
# Kompiuteris per Wi-Fi: tas pats kelias kaip telefonui.
- when: [connection_type=wifi]
  steps:
  - module: device_check
    args: {device: computer, what: wifi}
    on_fail:
      module: device_check
      args: {device: computer, what: reconnect}
  - module: verify
    args: {ask: restored}

escalate:
  note: "tinklas iki routerio veikia, kliento įrenginio patikra nepadėjo"

knowledge: troubleshooting/kliento_puse_internetas
