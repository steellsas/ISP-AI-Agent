# TINKLAS IKI ROUTERIO VEIKIA — problema kliento pusėje (v2 kortelė).
#
# Telemetrija sako, kad srautas iki routerio vaikšto, o klientui internetas neveikia. Agentas
# pasako, ką mato, ir klausimais ieško, KUR namuose nutrūksta (Andrius, 2026-11-04):
#
#   ar kituose įrenginiuose veikia? ── niekur ──────────► routeris
#        │ kituose veikia / įrenginys vienas
#   koks įrenginys, kaip jungiasi ───► Wi-Fi arba laido kopėčios ─► įrenginio perkrovimas
#        kituose veikia ─► paslauga teikiama, bėda įrenginyje: pasiūloma mokama pagalba
#        įrenginys vienas ─► routerio kopėčios ─► tiketas
#
# Kopėčios — `knowledge/v2/ladders/`, žodžiai pagal įrenginį ir jo sistemą — įrangos kataloge.
fault: healthy_to_router
service: internet
symptom: internet_down
# Tinklas iki kliento įrangos tvarkingas. Tai skaito paslauga, kuri JOJA ant kitos (IPTV per
# internetą): jei ši kortelė laikosi, televizija — savas gedimas; jei ne, pirma internetas.
line_ok: true
# Sprendimas vyksta kliento įrenginyje: agentas veda po žingsnį ir neskuba (2026-11-04).
pace: guided
explain:
  conclusion: "verdict.healthy_to_router.gloss"
  confirm: "pack.healthy_to_router.confirm"

when:
  all: [node_reachable=yes, line_link=up, traffic=flowing]

rules_out:
  - area_outage=yes
  - service_suspended=yes
  - device_registered=foreign
  - line_errors=high
  # Jei linijoje jokio įrenginio nematome, „tinklas iki routerio veikia" neturi prasmės —
  # tai miręs routeris.
  - device_seen=no
  # Įrenginys adreso net neprašo: tai routerio nustatymų kortelė (dhcp_silent).
  - dhcp=silent

needs:
  # Kur nutrūksta: kituose įrenginiuose veikia (one), niekur neveikia (all), ar įrenginys
  # vienintelis (single) — tada nežinome, ar kaltas įrenginys, ar routeris.
  fail_scope:
    ask: "pack.healthy_to_router.fail_scope.question"
    again: "pack.healthy_to_router.fail_scope.simpler"
    why: "pack.healthy_to_router.fail_scope.why"
    clarify: "pack.healthy_to_router.fail_scope.clarify"
    # Neatsakė — einame atsargiausiu keliu: įrenginys, tada routeris, tada tiketas. Niekada
    # nesakoma „kituose veikia", jei klientas to nepasakė.
    assume: single
    values:
      single: confirms
      all: confirms
      one: confirms
    # Eilė svarbi: „tik vienas" turi „tik ", kurį skaito ir `one`.
    answers:
      single: answers_healthy_to_router_fail_scope_single
      all: answers_healthy_to_router_fail_scope_all
      one: answers_healthy_to_router_fail_scope_one
  fail_device:
    ask: "pack.healthy_to_router.fail_device.question"
    when: [fail_scope!=all]
    values: {phone: confirms, computer: confirms}
    answers:
      "phone": answers_healthy_to_router_fail_device_phone
      "computer": answers_healthy_to_router_fail_device_computer
  connection_type:
    ask: "pack.healthy_to_router.connection_type.question"
    when: [fail_device=computer]
    why: "pack.healthy_to_router.connection_type.why"
    values: {wired: confirms, wifi: confirms}
    answers:
      "wired": answers_healthy_to_router_connection_type_wired
      "wifi": answers_healthy_to_router_connection_type_wifi
  rebooted:
    ask: "pack.healthy_to_router.rebooted.question"
    when: [fail_scope=all]
    why: "pack.healthy_to_router.rebooted.why"
    clarify: "pack.healthy_to_router.rebooted.clarify"
    values: {"yes": confirms, "no": confirms}
    answers:
      "yes": answers_healthy_to_router_rebooted_yes
      "no": answers_healthy_to_router_rebooted_no

solution:
# Niekur neveikia, routeris dar neperkrautas — perkrovimas yra pigiausias žingsnis.
- when: [fail_scope=all, rebooted=no]
  steps:
  - module: reach
    args: {device: router}
  - module: reboot
    args: {device: router, method: power}
  - module: verify
    args:
      evidence: [traffic=flowing]
      ask: restored
# Niekur neveikia, jau perkrovė — telefonu nebeliko ko daryti.
- when: [fail_scope=all, rebooted=yes]
  steps:
  - module: escalate
    args: {note: "klientas jau perkrovė routerį, tinklas iki routerio veikia"}

# Kituose įrenginiuose veikia — bėda TAME įrenginyje. Nepavyko: paslauga teikiama, siūloma
# mokama pagalba; registruojama tik klientui sutikus.
- when: [fail_scope=one, fail_device=phone]
  steps:
  - ladder: wifi
    args: {device: phone}
  - ladder: device
    args: {device: phone}
  - module: offer_fix
    args: {device: phone}
  - module: escalate
    args: {why: kliento_pagalba, note: "kituose įrenginiuose internetas veikia, telefone Wi-Fi patikra nepadėjo — klientas prašo mokamos pagalbos"}
    run_when: [fix_wanted=yes]
  - module: conclude
    args: {device: phone}
- when: [fail_scope=one, fail_device=computer, connection_type=wifi]
  steps:
  - ladder: wifi
    args: {device: computer}
  - ladder: device
    args: {device: computer}
  - module: offer_fix
    args: {device: computer}
  - module: escalate
    args: {why: kliento_pagalba, note: "kituose įrenginiuose internetas veikia, kompiuterio Wi-Fi patikra nepadėjo — klientas prašo mokamos pagalbos"}
    run_when: [fix_wanted=yes]
  - module: conclude
    args: {device: computer}
- when: [fail_scope=one, fail_device=computer, connection_type=wired]
  steps:
  - ladder: cable
    args: {device: computer}
  - ladder: device
    args: {device: computer}
  - module: offer_fix
    args: {device: computer}
  - module: escalate
    args: {why: kliento_pagalba, note: "kituose įrenginiuose internetas veikia, kompiuterio laido ir tinklo plokštės patikra nepadėjo — klientas prašo mokamos pagalbos"}
    run_when: [fix_wanted=yes]
  - module: conclude
    args: {device: computer}

# Įrenginys vienintelis — nežinome, ar kaltas jis, ar routeris: įrenginys, tada routeris, tada
# tiketas su nueitu keliu.
- when: [fail_scope=single, fail_device=phone]
  steps:
  - ladder: wifi
    args: {device: phone}
  - ladder: device
    args: {device: phone}
  - ladder: router
  - module: escalate
    args: {note: "vienintelis įrenginys (telefonas): Wi-Fi patikra ir routerio perkrovimas nepadėjo"}
- when: [fail_scope=single, fail_device=computer, connection_type=wifi]
  steps:
  - ladder: wifi
    args: {device: computer}
  - ladder: device
    args: {device: computer}
  - ladder: router
  - module: escalate
    args: {note: "vienintelis įrenginys (kompiuteris per Wi-Fi): Wi-Fi patikra ir routerio perkrovimas nepadėjo"}
- when: [fail_scope=single, fail_device=computer, connection_type=wired]
  steps:
  - ladder: cable
    args: {device: computer}
  - ladder: device
    args: {device: computer}
  - ladder: router
  - module: escalate
    args: {note: "vienintelis įrenginys (kompiuteris laidu): laido, tinklo plokštės patikra ir routerio perkrovimas nepadėjo"}

escalate:
  note: "tinklas iki routerio veikia, kliento pusės patikra nepadėjo"

knowledge: troubleshooting/kliento_puse_internetas
