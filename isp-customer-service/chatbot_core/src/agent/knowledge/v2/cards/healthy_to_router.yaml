# TINKLAS IKI ROUTERIO VEIKIA — problema kliento pusėje (v2 kortelė).
#
# Telemetrija sako, kad srautas iki routerio vaikšto, o klientui internetas neveikia. Agentas
# pasako, ką mato, ir PADEDA su tuo įrenginiu, dėl kurio skambina; kiti įrenginiai — tik
# įrankis, kai su juo nepavyksta (Andrius, 2026-11-05):
#
#   koks įrenginys ─► jo kopėčios (Wi-Fi arba laidas, perkrovimas) ─► pavyko: išspręsta
#        │ nepavyko
#   ar turite kitų įrenginių, ar juose veikia?
#        ├─ veikia ──► ar tas pats Wi-Fi? ─ ne: prijungti prie to paties ─ taip: bėda įrenginyje,
#        │                                                               pasiūloma mokama pagalba
#        └─ irgi neveikia / kito nėra ──► routerio kopėčios ──► tiketas („atlikome viską")
#
# Kopėčios — `knowledge/v2/ladders/`, žodžiai pagal įrenginį ir jo sistemą — įrangos kataloge.
fault: healthy_to_router
service: internet
symptom: internet_down
# Tinklas iki kliento įrangos tvarkingas. Tai skaito paslauga, kuri JOJA ant kitos (IPTV per
# internetą): jei ši kortelė laikosi, televizija — savas gedimas; jei ne, pirma internetas.
line_ok: true
# Sprendimas vyksta kliento įrenginyje: agentas veda po žingsnį ir neskuba (2026-11-04).
pace: guided
explain:
  conclusion: "verdict.healthy_to_router.gloss"
  confirm: "pack.healthy_to_router.confirm"

when:
  all: [node_reachable=yes, line_link=up, traffic=flowing]

rules_out:
  - area_outage=yes
  - service_suspended=yes
  - device_registered=foreign
  - line_errors=high
  # Jei linijoje jokio įrenginio nematome, „tinklas iki routerio veikia" neturi prasmės —
  # tai miręs routeris.
  - device_seen=no
  # Įrenginys adreso net neprašo: tai routerio nustatymų kortelė (dhcp_silent).
  - dhcp=silent

needs:
  # Koks įrenginys — pirmas ir dažnai jau pasakytas („telefone neveikia").
  fail_device:
    ask: "pack.healthy_to_router.fail_device.question"
    again: "pack.healthy_to_router.fail_device.simpler"
    # „Telefone neveikia" pasakoma bet kada — ir skundo pradžioje (gyvai 2026-11-05).
    heard_anytime: true
    # Nepasakė, koks įrenginys — tai ne aklavietė: Wi-Fi kopėčios tinka bet kuriam.
    assume: other
    values: {phone: confirms, computer: confirms, other: confirms}
    answers:
      "phone": answers_healthy_to_router_fail_device_phone
      "computer": answers_healthy_to_router_fail_device_computer
  connection_type:
    ask: "pack.healthy_to_router.connection_type.question"
    when: [fail_device=computer]
    why: "pack.healthy_to_router.connection_type.why"
    # Dažniausiai — Wi-Fi; laidas paaiškėja Wi-Fi kopėčiose („Wi-Fi išjungtas, aš laidu").
    assume: wifi
    values: {wired: confirms, wifi: confirms}
    answers:
      "wired": answers_healthy_to_router_connection_type_wired
      "wifi": answers_healthy_to_router_connection_type_wifi
  # Kur nutrūksta: kituose įrenginiuose veikia (one), niekur (all), įrenginys vienas (single).
  # Neklausiama iš pradžių — tai klausia `other_devices`, kai įrenginio kopėčios nepadėjo; bet
  # jei klientas pats pasako „niekur neveikia", einama tiesiai prie routerio.
  fail_scope:
    volunteered: true
    # „Visuose įrenginiuose neveikia" pasakyta bet kada — tiesiai prie routerio.
    heard_anytime: true
    values:
      single: confirms
      all: confirms
      one: confirms
    # Eilė svarbi: „tik vienas" turi „tik ", kurį skaito ir `one`.
    answers:
      single: answers_healthy_to_router_fail_scope_single
      all: answers_healthy_to_router_fail_scope_all
      one: answers_healthy_to_router_fail_scope_one
  rebooted:
    ask: "pack.healthy_to_router.rebooted.question"
    when: [fail_scope=all]
    why: "pack.healthy_to_router.rebooted.why"
    clarify: "pack.healthy_to_router.rebooted.clarify"
    values: {"yes": confirms, "no": confirms}
    answers:
      "yes": answers_healthy_to_router_rebooted_yes
      "no": answers_healthy_to_router_rebooted_no

solution:
# Niekur neveikia, o routerį jau perkrovėme MES ir tai nepadėjo (4 etapas, 2026-11-11): antrą
# kartą neprašom ir neklausiam, ar perkrovė — telefonu nebeliko ko daryti.
- when: [fail_scope=all, tried_router_reboot=failed]
  steps:
  - module: escalate
    args: {note: "routerį perkrovėme kartu su klientu, nepadėjo; tinklas iki routerio veikia"}

# Niekur neveikia (klientas pasakė pats), routeris dar neperkrautas — perkrovimas pigiausias.
- when: [fail_scope=all, rebooted=no]
  steps:
  - module: reach
    args: {device: router}
  - module: reboot
    args: {device: router, method: power}
  - module: verify
    args:
      evidence: [traffic=flowing]
      ask: restored
# Niekur neveikia, jau perkrovė — telefonu nebeliko ko daryti.
- when: [fail_scope=all, rebooted=yes]
  steps:
  - module: escalate
    args: {note: "klientas jau perkrovė routerį, tinklas iki routerio veikia"}

# telefonas — Wi-Fi kopėčios, tada izoliacija
- when: [fail_device=phone]
  steps:
  - ladder: wifi
    args: {device: phone}
  - ladder: device
    args: {device: phone}
  - ladder: isolate
    args: {device: phone}
  - module: escalate
    args: {note: "telefonas: atlikome visus veiksmus, kuriuos galima telefonu — įrenginio kopėčios, kiti įrenginiai, routerio perkrovimas"}

# kompiuteris per Wi-Fi — Wi-Fi kopėčios, tada izoliacija
- when: [fail_device=computer, connection_type=wifi]
  steps:
  - ladder: wifi
    args: {device: computer}
  - ladder: device
    args: {device: computer}
  - ladder: isolate
    args: {device: computer}
  - module: escalate
    args: {note: "kompiuteris per Wi-Fi: atlikome visus veiksmus, kuriuos galima telefonu — įrenginio kopėčios, kiti įrenginiai, routerio perkrovimas"}

# kompiuteris laidu — laido kopėčios, tada izoliacija
- when: [fail_device=computer, connection_type=wired]
  steps:
  - ladder: cable
    args: {device: computer}
  - ladder: device
    args: {device: computer}
  - ladder: isolate
    args: {device: computer}
  - module: escalate
    args: {note: "kompiuteris laidu: atlikome visus veiksmus, kuriuos galima telefonu — įrenginio kopėčios, kiti įrenginiai, routerio perkrovimas"}

# nepatikslintas įrenginys — bendros Wi-Fi kopėčios, tada izoliacija
- when: [fail_device=other]
  steps:
  - ladder: wifi
    args: {device: device}
  - ladder: device
    args: {device: device}
  - ladder: isolate
    args: {device: device}
  - module: escalate
    args: {note: "nepatikslintas įrenginys: atlikome visus veiksmus, kuriuos galima telefonu — įrenginio kopėčios, kiti įrenginiai, routerio perkrovimas"}

escalate:
  note: "tinklas iki routerio veikia, kliento pusės patikra nepadėjo"
  # Ką meistras tikrina, kai telefonu neišsprendėme (2026-11-05).
  checks:
    - pack.healthy_to_router.checks.router_wifi
    - pack.healthy_to_router.checks.device_network
    - pack.healthy_to_router.checks.other_device

knowledge: troubleshooting/kliento_puse_internetas
