# LINIJOJE NEMATOMA JOKIO ĮRENGINIO — miręs routeris (v2 kortelė, 3 banga)
#
# Signalas iki buto ateina, bet linija nemato kliento įrenginio. Pirma patikrinam su
# klientu, ar routeris apskritai gyvas (lemputės, maitinimas, rozetė) — jei lemputės dega,
# tai kita kortelė (laidas). Jei routeris miręs: meistras yra PAŽADAS (jis vyks bet kokiu
# atveju), o klientui dar pasiūlom laikiną internetą per kompiuterį — tiltą.
#
# Technikas (Andrius, 2026-08-13): „esmė yra sugedęs routeris ir tiketas turi būti
# registruotas; šalutinis dalykas — paleisti internetą laikinai".
#
# v1: internet_mires_routeris.yaml, 289 eil., 12 žingsnių.
fault: no_mac_observed
service: internet
symptom: internet_down
explain:
  conclusion: "pack.no_mac_observed.conclusion"
  confirm: "pack.no_mac_observed.confirm"

when:
  all: [node_reachable=yes, line_link=up, device_seen=no]

rules_out:
  - area_outage=yes
  - service_suspended=yes

needs:
  # Kontekstas, kurį žino tik klientas: ar prieš tai kas nutiko (elektros dingimas, audra,
  # darbai). Tai paaiškina, kodėl įrenginys iškrito iš linijos, ir nukreipia į maitinimą.
  recent_events:
    ask: "pack.no_mac_observed.recent_events.question"
    why: "pack.no_mac_observed.recent_events.why"
    clarify: "pack.no_mac_observed.recent_events.clarify"
    values: {"yes": confirms, "no": confirms}
    answers:
      "yes": answers_no_mac_observed_recent_events_yes
      "no": answers_no_mac_observed_recent_events_no
  # Routerio gyvybė: lemputės atmeta šią kortelę (dega = įrenginys gyvas, ieškom laido).
  lights:
    ask: "pack.no_mac_observed.lights.question"
    values: {"off": confirms, "on": rules_out, blinking: rules_out}
  power_cable:
    ask: "pack.no_mac_observed.power_cable.question"
    values: {plugged: confirms, unplugged: confirms}
  outlet_works:
    ask: "pack.no_mac_observed.outlet_works.question"
    values: {tried: confirms, not_working: confirms}
    # „Rozetė neveikia" apverčia istoriją (gedimas ne routeryje, o maitinime): pasakius tai
    # ne į klausimą, pirma pasitikslinam ir tik tada priimam.
    confirm_values: [not_working]
  # Tiltas: ar klientas turi kompiuterį, kurį galima jungti tiesiai į liniją.
  has_computer:
    ask: "pack.no_mac_observed.has_computer.question"
    clarify: "pack.no_mac_observed.has_computer.clarify"
    # Be šito kelio nėra: laikinas internetas per kompiuterį arba jo nėra. Todėl vietoj trečio
    # pakartojimo klientui pasakoma, KODĖL to reikia ir kas bus, jei nežinosim (4a, 2026-09-23).
    critical: true
    values: {"yes": confirms, "no": confirms}
  lan_active:
    ask: "pack.no_mac_observed.lan_active.question"
    when: [has_computer=yes]
    values: {active: confirms, inactive: confirms}
    answers:
      "inactive": answers_no_mac_observed_lan_active_inactive
      "active": answers_no_mac_observed_lan_active_active

solution:
# Kelias tas pats abiem atvejais, tik pabaiga skiriasi. Eilė seka diagnostiką, ne patogumą
# (Andrius, 2026-09-30): lemputės -> maitinimas -> IŠVADA -> keitimas, o laikinas internetas
# yra PASIŪLYMAS pakeliui, ne žingsnis, kurį klientas gauna nepaklaustas.
- when: [has_computer=yes]
  steps:
  # 1. Ar dėžutė gyva. Šito linija nemato, tad `confirms: true` — neperšokama.
  - module: check_lights
    args: {device: router}
    knowledge_need: priekine panele lemputes reiskia
  # 2. Ar elektra iki jos ateina. Be šito „routeris sugedęs" yra spėjimas: nedegančios
  #    lemputės vienodai reiškia ištrauktą laidą, mirusią rozetę ir mirusią dėžutę.
  - module: check_power
    args: {device: router}
  # 3. Laikinas internetas — PASIŪLYMAS. Atsisakius visi tilto žingsniai praleidžiami.
  - module: offer_bridge
    args: {to: computer}
  - module: connect_direct
    args: {to: computer}
    done_when: [bridge_agreed=no]
  - module: bind
    args: {device: computer}
    done_when: [bridge_agreed=no]
  - module: port_reset
    done_when: [bridge_agreed=no]
  - module: verify
    args:
      evidence: [device_seen=yes, traffic=flowing]
      ask: restored
    done_when: [bridge_agreed=no]
  # 4. Meistras — dėl KEITIMO, ir tiketas pasako, kas patikrinta.
  - module: escalate
    args:
      note: "lemputes nedega, maitinimas patikrintas - routeris nebeatsiranda linijoje,
        reikia keisti irengini; laikinas internetas pasiulytas"
# Kompiuterio nėra — tilto nėra, bet diagnostika ta pati.
- when: [has_computer=no]
  steps:
  - module: check_lights
    args: {device: router}
    knowledge_need: priekine panele lemputes reiskia
  - module: check_power
    args: {device: router}
  - module: escalate
    args:
      note: "lemputes nedega, maitinimas patikrintas - routeris tiketinai suges,
        reikia keisti irengini; kompiuterio tiltui nera"

escalate:
  need: "pack.no_mac_observed.ticket_need"
  note: "linijoje nematomas kliento įrenginys"

knowledge: troubleshooting/internet_mires_routeris_tiltas
