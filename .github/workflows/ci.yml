name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  quality:
    name: Lint, type-check & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: isp-customer-service
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (advisory)
        run: uv run mypy chatbot_core/src
        continue-on-error: true

      - name: Tests
        # RAG embedding model is not cached on the runner; force offline so the
        # RAG-dependent tests fail fast (and skip via require_kb) instead of
        # hammering the HF Hub and hitting 429 rate limits. RAG correctness is
        # covered in Phase 1, not here.
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: uv run pytest
