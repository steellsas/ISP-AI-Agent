name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  quality:
    name: Lint, type-check & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: isp-customer-service
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (advisory)
        run: uv run mypy chatbot_core/src
        continue-on-error: true

      # Enabled in Phase 0 step 2 (regression safety net):
      # - name: Tests
      #   run: uv run pytest
