name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  quality:
    name: Lint, type-check & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: isp-customer-service
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (advisory)
        run: uv run mypy chatbot_core/src
        continue-on-error: true

      - name: Tests
        # The embedding model is not on the runner and the Hub is not reachable from here, so
        # the twelve HYBRID tests skip themselves (`embeddings_or_skip`) and say so in the
        # summary. Everything they protect on the lexical side still runs: the sparse vector
        # still has to equal the lexical score, and the recall set still has to pass. Offline
        # is forced so the skip is instant instead of a retry storm against the Hub (429).
        #
        # If the hybrid should be covered here too, the model has to be cached on the runner
        # (actions/cache on ~/.cache/huggingface) and this env removed — see docs/TESTU_ZEMELAPIS.md.
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: uv run pytest -rs
